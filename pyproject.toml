[project]
name = "invoice-extract"
version = "0.1.0"
description = "Invoice Extract API with FastAPI and PostgreSQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "pillow>=11.0,<13",
    "pytesseract>=0.3.13,<1",
    "python-docx>=1.2,<2",
    "PyMuPDF>=1.26,<2",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-anthropic>=1.3,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-google-genai>=4.0,<5",
]
