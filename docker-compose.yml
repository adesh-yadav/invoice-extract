services:
  db:
    image: postgres:16-alpine
    container_name: invoice_extract_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-invoice_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-invoice_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invoice_extract_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-invoice_db}
      UPLOAD_DIR: /app/uploads
      ARTIFACT_DIR: /app/artifacts
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-26214400}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-20}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
    volumes:
      - .:/app
      - /app/.venv
      - uploads_data:/app/uploads
      - artifacts_data:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m src.modules.extraction.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-invoice_db}
      UPLOAD_DIR: /app/uploads
      ARTIFACT_DIR: /app/artifacts
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
      VISION_PROVIDER: ${VISION_PROVIDER:-}
      VISION_MODEL: ${VISION_MODEL:-}
      ENABLE_VISION_FALLBACK: ${ENABLE_VISION_FALLBACK:-true}
      OCR_CLEANUP_PROVIDER: ${OCR_CLEANUP_PROVIDER:-}
      OCR_CLEANUP_MODEL: ${OCR_CLEANUP_MODEL:-}
      ENABLE_OCR_CLEANUP: ${ENABLE_OCR_CLEANUP:-false}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-26214400}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-20}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
    volumes:
      - uploads_data:/app/uploads
      - artifacts_data:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  artifacts_data:
    driver: local
  ollama_models:
    driver: local
